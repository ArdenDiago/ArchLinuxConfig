# Tells xdg-desktop-portal which backend implements each portal interface
# under niri. Installed to ~/.config/xdg-desktop-portal/niri-portals.conf
# by modules/16-niri.sh.
#
# niri isn't wlroots-based, so xdg-desktop-portal-wlr doesn't work here.
# Instead niri exposes a mutter-compatible ScreenCast/RemoteDesktop D-Bus
# API that xdg-desktop-portal-gnome knows how to talk to — that's what
# makes Firefox's "Share Screen" (Meet, Discord, etc.) work at all under
# niri. gtk handles the file picker so you get GTK's plain chooser instead
# of pulling in Nautilus via the gnome backend.
#
# Reference: https://github.com/YaLTeR/niri/wiki/Xdg-Desktop-Portal
[preferred]
default=gnome;gtk
org.freedesktop.impl.portal.FileChooser=gtk
