# Minimal Hyprland config installed by modules/15-hyprland.sh.
# Docs: https://wiki.hyprland.org/Configuring/

# HDMI-A-1 on the left, laptop panel (eDP-1) on the right — eDP-1's position
# starts at HDMI-A-1's width (1920) so the two sit flush with no overlap/gap.
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = eDP-1, 1920x1080@144, 1920x0, 1.25

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# NVIDIA's hardware cursor plane goes out of sync with the compositor's own
# cursor rendering on this GPU, producing a visible duplicate/ghost cursor.
# Forcing software-only cursor rendering fixes it. See:
# https://wiki.hyprland.org/Nvidia/#i-have-two-cursors-render-in-a-corner-of-my-screen
env = WLR_NO_HARDWARE_CURSORS,1

exec-once = mako
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = ~/.config/wallpaper/restore.sh

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
}

decoration {
    rounding = 8
}

animations {
    enabled = true
}

dwindle {
    preserve_split = true
}

# Application launch
bind = SUPER, Return, exec, alacritty
bind = SUPER, D, exec, fuzzel
bind = SUPER, Q, killactive,
bind = SUPER, V, togglefloating,
bind = SUPER, F, fullscreen,
bind = SUPER, L, exec, hyprlock
bind = SUPER, W, exec, ~/.config/wallpaper/select.sh
bind = SUPER SHIFT, E, exit,

# Focus movement
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Mouse: drag/resize floating windows
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Keyboard: resize active tiled window/split (hold, repeats while held)
binde = SUPER SHIFT, left, resizeactive, -20 0
binde = SUPER SHIFT, right, resizeactive, 20 0
binde = SUPER SHIFT, up, resizeactive, 0 -20
binde = SUPER SHIFT, down, resizeactive, 0 20
