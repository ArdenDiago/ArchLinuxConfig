# Matches the SDDM login theme (Qylock "Pixel · Night City"): split
# white/teal HH MM clock, uppercase date, uppercase username, pink pill
# password field. No circular indicator — background is a still frame
# pulled from that theme's bg.mp4.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

background {
    monitor =
    path = $HOME/.config/hypr/lockscreen.png
    blur_passes = 0
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +'<span foreground="##e8e4f0">%H</span>  <span foreground="##d06880">|</span>  <span foreground="##50c8d8">%M</span>'
    font_size = 100
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %-d' | tr 'a-z' 'A-Z'
    color = rgba(e8e4f0dd)
    font_size = 14
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = cmd[update:0] echo $USER | tr 'a-z' 'A-Z'
    color = rgba(e8e4f0ff)
    font_size = 20
    font_family = $font
    position = 0, -60
    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    rounding = 6
    inner_color = rgba(06081088)
    outer_color = rgba(d06880e6)
    check_color = rgba(50c8d8e6)
    fail_color = rgba(ff4444e6)
    font_color = rgba(d06880ff)
    font_family = $font
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    placeholder_text = <span foreground="##50c8d8cc">Enter Password</span>
    fail_text = <span foreground="##ff4444">Access Denied</span>
    position = 0, -110
    halign = center
    valign = center
}
