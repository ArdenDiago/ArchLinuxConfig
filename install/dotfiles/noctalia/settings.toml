# noctalia settings, as configured in the live 2026-08-28 session that
# replaced DankMaterialShell with noctalia on a niri desktop.
#
# Installed by modules/16-niri.sh to ~/.local/state/noctalia/settings.toml (the
# state-dir settings.toml, which noctalia's config stack always applies last
# and lets override anything else — see noctalia's own `config export`
# --help). @@HOME@@ is replaced with the real $HOME by that module; the file
# isn't valid as-is until that substitution runs.

[brightness]
# Never let it hit 0 — dull is fine, fully off is not. Steps below 10% are
# 2% instead of the usual 5% (see niri/brightness-step.sh), so it settles
# here instead of overshooting past it.
minimum_brightness = 0.02

[hooks]
# Keeps niri's Overview backdrop color in sync with the current palette —
# see niri/sync-overview-color.sh for why this exists at all.
colors_changed = "@@HOME@@/.config/niri/sync-overview-color.sh"

[theme]
builtin = "Gruvbox"
community_palette = "Oxide"
mode = "dark"
# Pinned to the Oxide community palette. Was "wallpaper" (regenerate from
# the current wallpaper on every change) until 2026-10; wallpaper_scheme
# only matters if this is switched back.
source = "community"
wallpaper_scheme = "vibrant"

    [theme.templates]
    # Push the generated palette into these apps' own theme files whenever
    # it changes (niri window borders, GTK3/4, the alacritty terminal, Qt
    # apps, btop). Full available list: alacritty, btop, cava, emacs, foot,
    # ghostty, gtk3, gtk4, helix, kcolorscheme, kitty, labwc, mango, qt,
    # scroll, sway, umbriel, starship, wezterm, niri, hyprland.
    builtin_ids = [ "btop", "niri", "gtk3", "gtk4", "alacritty", "qt" ]

[wallpaper]
# skwd-wall (see modules/26-wallpaper-skwd.sh) is the wallpaper picker/
# renderer actually in use, not noctalia's own. With both enabled they each
# ran their own independent background layer-shell surface and fought over
# it — whichever recreated its surface last (monitor hotplug, lock/unlock)
# painted over the other, so a pick made through skwd-wall would silently
# revert to whatever noctalia last had. Disabling noctalia's renderer here
# leaves skwd-wall as the only one drawing the desktop background.
enabled = false

[wallpaper.default]
path = "@@HOME@@/Pictures/Wallpapers/wallpaper.jpg"

[bar.default]
# Left: workspace indicator, numbered-pill style (not the dot-style
# "focus_hint" default), then the display-control plugin's button.
start = [ "workspaces", "arden/display-control:bar" ]
# Center: now-playing media, then the clock.
center = [ "media", "clock" ]
# Right, reading left to right (so rightmost = screen edge): tray, then
# clipboard/notifications/system-monitor icons, then bluetooth, then
# volume/battery, then Control Center toggle, then the power button pinned
# at the extreme right edge.
end = [ "tray", "clipboard", "notifications", "cpu", "ram", "gpu", "network", "network_rx", "network_tx", "bluetooth", "volume", "battery", "control-center", "session" ]
# Default 6px felt cramped between the media/clock pair in the center once
# the clock started showing day+date, not just time.
widget_spacing = 14

[control_center]
# Full labeled sidebar instead of the icon-only default.
sidebar = "full"
# Fixed pixel width (noctalia has no percentage-of-screen option) — sized
# against the smaller of two monitors, then bumped up further on request.
# Noctalia clamps this to whatever actually fits the screen, so an
# oversized value here is safe, not a bug.
width = 2000

[backdrop]
# Dims the screen behind a floating panel (Control Center, Session).
# Left disabled: with it on, the dim surface wasn't tearing down when no
# panel was open, leaving a permanent blur/tint over the whole desktop
# instead of just showing behind panels as intended. Revisit if noctalia
# fixes that lifecycle bug upstream.
enabled = false

[shell.panel]
# Both panels float centered on screen instead of noctalia's default
# "attached near the bar" placement.
control_center_placement = "floating"
control_center_position = "center"
session_placement = "floating"
session_position = "center"
wallpaper_placement = "floating"
wallpaper_position = "center"
transparency_mode = "glass"

[shell.session]
# Single-column list (not the multi-column grid default) — each action its
# own row: Reboot, Lock, Suspend, Log Out, Shut Down, with a keyboard
# shortcut letter shown per row.
grid = true
grid_columns = 1
show_shortcuts = true

# Destructive actions (reboot/logout/shutdown) require a second press
# within the countdown window to confirm — press once to arm, press again
# before it hits 0 to confirm, or it auto-cancels. Lock/suspend fire
# instantly since they're low-risk/reversible.
[[shell.session.actions]]
action = "reboot"
shortcut = "R"
countdown_seconds = 3

[[shell.session.actions]]
action = "lock"
shortcut = "L"
countdown_seconds = 0

[[shell.session.actions]]
action = "suspend"
shortcut = "S"
countdown_seconds = 0

[[shell.session.actions]]
action = "logout"
shortcut = "O"
countdown_seconds = 2

[[shell.session.actions]]
action = "shutdown"
shortcut = "D"
countdown_seconds = 3

[shell]
# 12-hour clock instead of noctalia's default 24-hour, with day + date.
time_format = "{:%a %d %I:%M %p}"
# Rounder panels/widgets than the default 1.0.
corner_radius_scale = 1.6

    [shell.screen_corners]
    size = 21

    [shell.shadow]
    alpha = 0.94

[accessibility]
# Whole shell UI at 85% — the default felt oversized on the 1080p panels.
ui_scale = 0.85

[hot_corners]
delay_ms = 2000

[weather]
enabled = false

[widget.clock]
format = "{:%a %d %I:%M %p}"
type = "clock"

[widget.workspaces]
show_labels = true
# Numbered animated pills (not "focus_hint"'s dots-plus-expanded-pill, and
# not "minimal" text-only).
style = "regular"

[widget.network]
# Icon only — no SSID name shown next to it.
show_label = false

[widget.bluetooth]
# Icon only — no connected-device name shown next to it.
show_label = false

# CPU/RAM/GPU/network throughput as bar-icon meters, via noctalia's generic
# "sysmon" widget type (one stat per widget instance — there's no built-in
# widget that combines multiple stats into one). Each shows icon only
# (show_value/show_glyph = false where relevant), and left-clicking any of
# them toggles a floating, centered btop — see niri/launch-btop-float.sh.
[widget.cpu]
stat = "cpu_usage"
type = "sysmon"
show_value = false

    [widget.cpu.actions]
    left = "@@HOME@@/.config/niri/launch-btop-float.sh"

[widget.ram]
stat = "ram_used"
type = "sysmon"
show_value = false

    [widget.ram.actions]
    left = "@@HOME@@/.config/niri/launch-btop-float.sh"

[widget.gpu]
stat = "gpu_usage"
type = "sysmon"
show_value = false

    [widget.gpu.actions]
    left = "@@HOME@@/.config/niri/launch-btop-float.sh"

[widget.network_rx]
stat = "net_rx"
type = "sysmon"
show_value = false
# No download-arrow icon of its own — sits right after the network widget's
# icon so the pair reads as "icon, then two small level meters".
show_glyph = false
# Fixed level bar, not a scrolling history graph ("graph" was tried and
# rejected in favor of this).
visualization = "gauge"

    [widget.network_rx.actions]
    left = "@@HOME@@/.config/niri/launch-btop-float.sh"

[widget.network_tx]
stat = "net_tx"
type = "sysmon"
show_value = false
show_glyph = false
visualization = "gauge"

    [widget.network_tx.actions]
    left = "@@HOME@@/.config/niri/launch-btop-float.sh"

# Not configured, and deliberately so — checked noctalia's full settings
# schema for both and neither exists:
#   - A wifi/Bluetooth signal-strength meter widget (only icon or
#     icon+label display modes are available for the network/bluetooth
#     widget types).
#   - Per-widget color thresholds for the volume widget (sysmon widgets get
#     activity/critical thresholds; volume does not).

[plugins]
# The display-control plugin (a path-kind source below, installed by
# modules/16-niri.sh to ~/.config/noctalia/plugins/local/display-control)
# needs to be both registered as a source AND listed here to actually load
# — official/community are noctalia's own built-in catalog sources,
# declared explicitly so a fresh settings.toml matches what noctalia would
# otherwise only add the first time its plugin browser UI is opened.
enabled = [ "arden/display-control" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "@@HOME@@/.config/noctalia/plugins/local"
    name = "arden-local"
