<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>

  <form class="search-wrapper" id="search-form">
    <div class="search-inner-wrapper">
      <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="7" cy="7" r="5"></circle>
        <line x1="11" y1="11" x2="15" y2="15"></line>
      </svg>
      <input id="search-input" type="text" placeholder="Search the web" autocomplete="off" autofocus>
    </div>
  </form>

  <div class="pomodoro" id="pomodoro">
    <div class="pomodoro-mode" id="pomodoro-mode">Focus</div>
    <div class="pomodoro-ring-wrap">
      <svg class="pomodoro-ring" viewBox="0 0 100 100">
        <circle class="ring-track" cx="50" cy="50" r="44"></circle>
        <circle class="ring-progress" id="ring-progress" cx="50" cy="50" r="44"></circle>
      </svg>
      <div class="pomodoro-time" id="pomodoro-time">25:00</div>
    </div>
    <div class="pomodoro-controls">
      <button id="pomodoro-toggle" class="pomodoro-btn primary" type="button">Start</button>
      <button id="pomodoro-reset" class="pomodoro-btn" type="button">Reset</button>
    </div>
    <div class="pomodoro-sessions" id="pomodoro-sessions">Session 1 of 4</div>
  </div>

  <div class="radial-launcher" id="radial-launcher">
    <div class="radial-hitzone" id="radial-hitzone" hidden></div>
    <div class="radial-ring" id="radial-ring" role="menu" hidden></div>
    <button class="radial-hub" id="radial-hub" type="button" aria-label="Open quick links" aria-expanded="false"></button>
    <button class="radial-add" id="radial-add" type="button" title="Add a link" hidden>+</button>
    <input type="file" id="radial-icon-input" accept="image/*" hidden>
  </div>

  <script src="launcher.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
